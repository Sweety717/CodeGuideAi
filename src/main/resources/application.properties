server.port=8080

# ---------------------------------------------------------------------------
# Database - H2 file-based by default, zero setup. Switch to MySQL for
# production by commenting this block and uncommenting the one below.
# ---------------------------------------------------------------------------
#spring.datasource.url=jdbc:h2:file:./data/codeguarddb;AUTO_SERVER=TRUE
#spring.datasource.driver-class-name=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=false
#spring.jpa.open-in-view=false

# --- MySQL (production) ---
 spring.datasource.url=jdbc:mysql://localhost:3306/codeguard?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
 spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
 spring.datasource.username=root
 spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
 spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---------------------------------------------------------------------------
# GitHub - a Personal Access Token with "repo" scope (classic) or
# "Pull requests: Read & Write" (fine-grained) on the repos you want reviewed.
# https://github.com/settings/tokens
# ---------------------------------------------------------------------------
github.token=
# Any random string - set the SAME value when creating the webhook in GitHub
# repo settings (Settings > Webhooks > Add webhook > Secret).
github.webhook-secret=

# ---------------------------------------------------------------------------
# Choose your AI provider: openai | gemini | ollama
# Model names are read ONLY from this file - no hardcoded fallbacks in code.
# ---------------------------------------------------------------------------
ai.provider=gemini

# --- OpenAI (https://platform.openai.com/api-keys) ---
openai.api.key=CHANGE_ME
openai.model=gpt-4o-mini

# --- Google Gemini (https://aistudio.google.com/apikey) ---
# If you get a 404 "model no longer available" error, check
# https://ai.google.dev/gemini-api/docs/models for the current model list.
gemini.api.key=
gemini.model=gemini-3.6-flash

# --- Ollama (free, runs locally - https://ollama.com) ---
ollama.url=http://localhost:11434
ollama.model=llama3.1
